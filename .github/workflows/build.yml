name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
      - uses: actions/upload-artifact@v4
        with:
          name: AutoBot
          path: ${{ steps.build.outputs.build-output }}
